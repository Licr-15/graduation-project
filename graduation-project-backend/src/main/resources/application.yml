spring:
  application:
    name: graduation-project-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lvyin_sport?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:lcr}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 6MB
    max-swallow-size: 6MB
jwt:
  secret: ${JWT_SECRET:lvyin-sport-jwt-secret-key-2026-please-change}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
