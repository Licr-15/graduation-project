ck}.detailhero{height:285px;background:url('assets/basketball.jpg') center 47%/cover;border-radius:6px}.detailtitle{font-size:29px;margin:22px 0 10px}.pills{display:flex;gap:8px;margin-bottom:23px}.pill{background:#e5f2e8;color:#2b704a;padding:7px 10px;border-radius:4px;font-size:12px}.block{border-top:1px solid #e0e8e2;padding:22px 0}.block h3{font-size:17px;margin:0 0 12px}.block p{color:#5d7064;line-height:1.9;margin:0}.people{display:flex;align-items:center;gap:8px}.person{background:#e1efe7;color:#2a6647;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}.sidepanel{border:1px solid #dae5dd;background:white;border-radius:6px;padding:23px;height:max-content;margin-top:37px}.sidepanel h3{font-size:17px;margin:0 0 20px}.info{border-bottom:1px solid #edf1ed;padding:0 0 14px;margin-bottom:14px;color:#6d8071}.info strong{display:block;color:#20382b;margin-top:6px;font-size:16px}.progress{height:8px;background:#e7eee9;border-radius:8px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;width:66%;height:100%;background:#3b9662}.wide{width:100%;margin-top:14px}.muted{color:#779081;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:white;border:1px solid #dfe8e1;border-radius:6px;padding:21px}.stat label{color:#6c8172}.stat strong{display:block;font-size:28px;margin:10px 0 3px}.stat small{color:#3c9662}.tablewrap{background:white;border:1px solid #dfe8e1;border-radius:6px;overflow:hidden}.tablehead{display:flex;justify-content:space-between;align-items:center;padding:22px 23px}.tablehead h3{margin:0;font-size:18px}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-weight:500;background:#f7faf8;color:#758779;font-size:12px}.table td,.table th{padding:17px 23px;border-top:1px solid #e7eee8}.table td{color:#3c5143}.table td:first-child{font-weight:700;color:#20382a}.status{display:inline-block;background:#e4f4e9;color:#2b7e4b;padding:5px 9px;border-radius:4px;font-size:12px}.status.off{background:#f2f4f2;color:#7b877d}.link{color:#28794d}.adminmini{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:20px}.mini{background:white;border:1px solid #dfe8e1;border-radius:6px;padding:20px}.mini h3{font-size:16px;margin:0 0 18px}.bars{height:120px;display:flex;align-items:end;gap:12px}.bars i{flex:1;background:#7bb993;border-radius:3px 3px 0 0}.bars i:nth-child(3n){background:#2d7f55}.notice{display:flex;justify-content:space-between;border-top:1px solid #e9eee9;padding:11px 0;color:#536a59}.notice:first-of-type{border:0}#page{display:none}@media(max-width:900px){.rail{width:65px;padding:20px 8px}.brand{font-size:0;padding:0 8px 30px}.nav{font-size:0;justify-content:center}.navtitle,.railfoot{display:none}.content{padding:25px}.topbar{padding:0 25px}.grid{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:1fr}.sidepanel{margin-top:0}.stats{grid-template-columns:repeat(2,1fr)}}

<body><div class="shell"><aside class="rail"><div class="brand"><span class="brandmark">✦</span>绿茵结伴</div><div class="navtitle">学生端</div><a class="nav" href="?page=discover"><span>⌕</span>发现活动</a><a class="nav" href="?page=detail"><span>◉</span>活动详情</a><a class="nav" href="?page=discover"><span>＋</span>发布结伴</a><a class="nav" href="?page=discover"><span>▤</span>我的活动</a><div class="navtitle">管理端</div><a class="nav" href="?page=admin"><span>▦</span>管理总览</a><a class="nav" href="?page=admin"><span>☷</span>活动管理</a><div class="railfoot">校园运动，从一起开始<br>帮助每个人找到搭子</div></aside><div class="main"><header class="topbar"><span class="crumb" id="crumb"></span><div class="topright"><span>◯</span><span>▢</span><span class="avatar">李</span><span>李同学⌄</span></div></header><main id="page" class="content"></main></div></div>
<script>
const card=(name,sport,img,time,place,people,host)=>`<article class="activity"><div class="photo" style="background-image:url('${img}')"><span class="badge">正在招募</span><span class="type">${sport}</span></div><div class="body"><h4>${name}</h4><div class="meta">◷　${time}</div><div class="meta">⌖　${place}</div><div class="cardfoot"><span><span class="miniavatar">${host[0]}</span>${host}　·　${people} 人已报名</span><a class="join" href="?page=detail">查看活动 →</a></div></div></article>`;
const pages={discover:`<div class="heading"><div><h1>发现运动搭子</h1><p>看看同学们正在约什么运动，挑一场适合自己的加入。</p></div><button class="primary">＋　发布结伴活动</button></div><section class="banner"><div><small>绿茵结伴 · 校园运动社区</small><h2>下一场运动，和志同道合的同学一起出发</h2><p>从羽毛球、篮球到跑步，找到时间相合的运动搭子。</p></div></section><div class="filter"><div class="seg"><button class="chip on">全部运动</button><button class="chip">羽毛球</button><button class="chip">篮球</button><button class="chip">足球</button><button class="chip">跑步</button><button class="chip">乒乓球</button></div><input class="search" placeholder="⌕  搜索活动或地点"></div><div class="sectionrow"><h3>近期可加入的活动</h3><span>按开始时间排序　⌄</span></div><div class="grid">${card('周三晚一起打羽毛球','羽毛球','assets/running.jpg','11月 06日 19:00 - 21:00','校体育馆 · 羽毛球场','2 / 4','陈同学')}${card('篮球半场，差两位队友','篮球','assets/basketball.jpg','11月 07日 16:00 - 18:00','中心篮球场','6 / 8','王同学')}${card('周末操场轻松跑 5 公里','跑步','assets/running.jpg','11月 08日 07:30 - 08:30','东门操场集合','3 / 10','林同学')}${card('足球友谊局，欢迎新手','足球','assets/football.jpg','11月 08日 15:00 - 17:00','南区足球场','8 / 12','赵同学')}${card('晚饭后乒乓球练习','乒乓球','assets/basketball.jpg','11月 09日 19:30 - 20:30','学生活动中心','1 / 2','周同学')}${card('周日晨跑，一起打卡','跑步','assets/running.jpg','11月 10日 06:45 - 07:45','图书馆前集合','4 / 8','刘同学')}</div>`,detail:`<a class="back" href="?page=discover">←　返回活动列表</a><div class="detailgrid"><div><div class="detailhero"></div><h1 class="detailtitle">篮球半场，差两位队友</h1><div class="pills"><span class="pill">篮球</span><span class="pill">正在招募</span><span class="pill">校园运动</span></div><section class="block"><h3>活动介绍</h3><p>周四下午来打一场轻松的半场篮球，水平不限，欢迎新同学加入。大家以交流和运动为主，提前十分钟到场热身即可。</p></section><section class="block"><h3>已加入的搭子</h3><div class="people"><span class="person">王</span><span class="person">陈</span><span class="person">林</span><span class="person">赵</span><span class="person">刘</span><span class="person">周</span><span class="muted">还有 2 个名额</span></div></section><section class="block"><h3>活动讨论</h3><p><strong>陈同学</strong>　球场从东门进比较近，周四见！</p><p><strong>王同学</strong>　没问题，记得带水。</p></section></div><aside class="sidepanel"><h3>活动信息</h3><div class="info">运动项目<strong>篮球 · 半场交流</strong></div><div class="info">活动时间<strong>11月 07日　16:00 - 18:00</strong></div><div class="info">集合地点<strong>中心篮球场</strong></div><div class="info">发起人<strong>王同学</strong></div><div class="info">报名人数<strong>6 / 8 人</strong><div class="progress"><i></i></div><small>还可报名 2 人</small></div><button class="primary wide">加入这场运动</button><p class="muted">加入后可在“我的活动”中查看和取消报名。</p></aside></div>`,admin:`<div class="heading"><div><h1>管理总览</h1><p>查看平台活动与用户情况，处理日常管理事项。</p></div><button class="ghost">导出数据</button></div><div class="stats"><div class="stat"><label>注册用户</label><strong>1,284</strong><small>↑ 本周新增 42 人</small></div><div class="stat"><label>活动总数</label><strong>326</strong><small>↑ 本周新增 18 场</small></div><div class="stat"><label>正在招募</label><strong>37</strong><small>覆盖 6 种运动</small></div><div class="stat"><label>累计报名</label><strong>2,146</strong><small>↑ 本周新增 103 人次</small></div></div><section class="tablewrap"><div class="tablehead"><h3>近期活动</h3><button class="ghost">查看全部活动 →</button></div><table class="table"><thead><tr><th>活动名称</th><th>运动类型</th><th>发起人</th><th>活动时间</th><th>人数</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>周三晚一起打羽毛球</td><td>羽毛球</td><td>陈同学</td><td>11月 06日 19:00</td><td>2 / 4</td><td><span class="status">招募中</span></td><td class="link">查看</td></tr><tr><td>篮球半场，差两位队友</td><td>篮球</td><td>王同学</td><td>11月 07日 16:00</td><td>6 / 8</td><td><span class="status">招募中</span></td><td class="link">查看</td></tr><tr><td>周末操场轻松跑 5 公里</td><td>跑步</td><td>林同学</td><td>11月 08日 07:30</td><td>3 / 10</td><td><span class="status">招募中</span></td><td class="link">查看</td></tr><tr><td>上周五足球友谊赛</td><td>足球</td><td>赵同学</td><td>10月 30日 15:00</td><td>12 / 12</td><td><span class="status off">已结束</span></td><td class="link">查看</td></tr></tbody></table></section><div class="adminmini"><section class="mini"><h3>本周活动发布趋势</h3><div class="bars"><i style="height:43%"></i><i style="height:58%"></i><i style="height:70%"></i><i style="height:53%"></i><i style="height:82%"></i><i style="height:63%"></i><i style="height:92%"></i></div></section><section class="mini"><h3>最新公告</h3><div class="notice"><span>体育馆周末开放时间调整</span><span>11月 03日</span></div><div class="notice"><span>校园运动安全提示</span><span>10月 28日</span></div><div class="notice"><span>冬季运动活动报名通知</span><span>10月 20日</span></div></section></div>`};
const key=new URLSearchParams(location.search).get('page')||'discover';document.getElementById('page').innerHTML=pages[key]||pages.discover;document.getElementById('page').style.display='block';document.getElementById('crumb').textContent='绿茵结伴 / '+({discover:'发现活动',detail:'活动详情',admin:'管理总览'}[key]||'发现活动');document.querySelectorAll('.nav').forEach(n=>{if(n.href.endsWith('page='+key))n.classList.add('active')});
</script><script>
document.querySelectorAll('.nav.active').forEach((item,index)=>{if(index>0)item.classList.remove('active')});
</script></body></html>
